<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Hörzu</title>
</head>

<body>

    <style>
        #dbn_fm_modal {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            max-width: 500px;
            width: 90%;
            padding: 1.3rem;
            min-height: 250px;
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4vmin;
            z-index: 5004000;
            text-align: center;
        }

        #dbn_fm_modal * {
            font-family: "Source Sans Pro", "Roboto", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        #dbn_fm_modal p {
            margin: 0;
            font-size: 14px;
            ;
        }
        #dbn_fm_h3 {
            margin-top: 50px;
        }

        #dbn_fm_button {
            position: absolute;
            top: 0.9rem;
            right: 0.9rem;
            padding: 0.06rem 0.06rem;
            background: #69bfab;
            color: white;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            font-weight: 600;
            height: 2rem;
            width: 2rem;
            font-size: 1.2rem;
            box-sizing: content-box;
        }

        #dbn_fm_button:hover {
            background-color: #1a9578;
        }

        #dbn_fm_overlay {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
            z-index: 5003000;
        }

        .dbn_fm_hidden {
            display: none !important;
        }

        #dbn_fm_link_button {
            background-color: #69bfab;
            color: white;
            padding: 20px;
            text-decoration: none;
            font-size: bigger;
            text-transform: uppercase;
            border-radius: 10px;
        }

        #dbn_fm_link_button:hover {
            background-color: #1a9578;
        }

        #dbn_fm_anzeige {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: smaller;
        }
    </style>
    <div id="dbn_fm_modal" class="dbn_fm_hidden">
        <h3 id="dbn_fm_h3">Deine Meinung ist gefragt!</h3>
        <p>
            Teile uns deine Meinung mit! Unter allen Teilnehmenden verlosen wir 100 Jahresabos der
            Zeitschrift Streaming. Jetzt mitmachen und gewinnen!
        </p><br>
        <a id="dbn_fm_link_button" href="https://listening.sslsurvey.de/2025_04_Werbewirkung-hoerzu.de"
            target="_blank">Hier
            teilnehmen</a>
        <div id="dbn_fm_anzeige">
            <img src="https://www.funke.fun/build/assets/hz-D8BHgvyn.png" alt="HÖRZU Logo">
        </div>
        <button id="dbn_fm_button">&#x2716;</button>
    </div>
    <div id="dbn_fm_overlay" class="dbn_fm_hidden"></div>
    <script type="text/javascript">
        (function () {
            var modal = document.getElementById('dbn_fm_modal');
            var overlay = document.getElementById('dbn_fm_overlay');
            var button = document.getElementById('dbn_fm_button');
            var linkButton = document.getElementById('dbn_fm_link_button');
            var cookieName = 'dbn_fm_dv';
            var fourWeeksInSeconds = 60 * 60 * 24 * 28;
            var blockedExpiration = 60 * 60 * 24 * 365 * 10; // keep the block effectively permanent

            function showModal() {
                modal.classList.remove('dbn_fm_hidden');
                overlay.classList.remove('dbn_fm_hidden');
            }

            function hideModal() {
                modal.classList.add('dbn_fm_hidden');
                overlay.classList.add('dbn_fm_hidden');
            }

            function setCookie(cookieValue, expirationSeconds) {
                var date = new Date();
                date.setTime(date.getTime() + expirationSeconds * 1000);
                var expiresAt = date.toUTCString();
                document.cookie = cookieName + '=' + encodeURIComponent(cookieValue) + '; SameSite=None; Secure; expires=' + expiresAt + '; path=/; domain=.hoerzu.de'; // exchange with current domain
            }

            function getCookie() {
                var match = document.cookie.match(new RegExp('(?:^|; )' + cookieName + '=([^;]*)'));
                return match ? decodeURIComponent(match[1]) : null;
            }

            button.addEventListener('click', function () {
                setCookie('blocked', blockedExpiration);
                hideModal();
            });

            if (linkButton) {
                linkButton.addEventListener('click', function () {
                    setCookie('participated', fourWeeksInSeconds);
                    hideModal();
                });
            }

            if (!getCookie()) {
                setTimeout(function () {
                    showModal();
                }, 10000); // 10 Sekunden
            }
        })();
    </script>
</body>

</html>
