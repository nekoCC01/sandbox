    <script type="text/javascript">
        (function () {
            var modal = document.getElementById('dbn_fm_modal');
            var overlay = document.getElementById('dbn_fm_overlay');
            var button = document.getElementById('dbn_fm_button');
            var linkButton = document.getElementById('dbn_fm_link_button');
            var cookieName = 'dbn_fm_dv';
            var fourWeeksInSeconds = 60 * 60 * 24 * 28;
            var blockedExpiration = 60 * 60 * 24 * 365 * 10; // keep the block effectively permanent

            function showModal() {
                modal.classList.remove('dbn_fm_hidden');
                overlay.classList.remove('dbn_fm_hidden');
            }

            function hideModal() {
                modal.classList.add('dbn_fm_hidden');
                overlay.classList.add('dbn_fm_hidden');
            }

            function setCookie(cookieValue, expirationSeconds) {
                var date = new Date();
                date.setTime(date.getTime() + expirationSeconds * 1000);
                var expiresAt = date.toUTCString();
                document.cookie = cookieName + '=' + encodeURIComponent(cookieValue) + '; SameSite=None; Secure; expires=' + expiresAt + '; path=/; domain=.hoerzu.de'; // exchange with current domain
            }

            function getCookie() {
                var match = document.cookie.match(new RegExp('(?:^|; )' + cookieName + '=([^;]*)'));
                return match ? decodeURIComponent(match[1]) : null;
            }

            button.addEventListener('click', function () {
                setCookie('blocked', blockedExpiration);
                hideModal();
            });

            if (linkButton) {
                linkButton.addEventListener('click', function () {
                    setCookie('participated', fourWeeksInSeconds);
                });
            }

            if (!getCookie()) {
                setTimeout(function () {
                    showModal();
                }, 1); // 15 Sekunden
            }
        })();
    </script>
